<!doctype html>
<html><head><meta charset="utf-8"><title>Z-zero explainer</title>
<style>
@font-face{font-family:'Zero Display';src:url(../assets/fonts/teko-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:'Wanted Sans';src:url(../assets/fonts/WantedSans-Variable.woff2) format('woff2');font-weight:100 900}
html,body{margin:0;background:#0b0c0a}canvas{display:block;width:100vw;height:auto}
</style></head>
<body><canvas id="c" width="1440" height="1080"></canvas>
<script>
// Z-zero 제품 설명 모션 그래픽 — draw(t)가 t초의 프레임을 그림
// ?bg=0 배경 투명, ?fill=0 다리 실루엣 채움 없음, ?text=0 글자 없음
const Q=new URLSearchParams(location.search);
const BG=Q.get('bg')!=='0', FILL=Q.get('fill')!=='0', TEXT=Q.get('text')!=='0';
const W=1440,H=1080,cv=document.getElementById('c'),g=cv.getContext('2d');
const LIME='212,238,59', ORANGE='255,122,26', WHITE='237,237,235', GREY='160,162,158';
const DUR=22;

// ── 장면 시간표 (초) ──
const S={scan:[0,3], sense:[3,7.2], alert:[7.2,9.6], tight:[9.6,14.2], cam:[14.2,18.6], end:[18.6,22]};

// ── 다리 형상: 실제 슬리브 사진 기준 (위 접힌 밴드, 사선 패널, 뒤꿈치 트인 발걸이), 바깥쪽에서 본 오른쪽 다리 ──
const OX=-170; // 다리를 왼쪽으로 옮겨 오른쪽에 글 자리
const PROF=[[40,606,822],[150,566,818],[300,532,808],[420,548,802],[560,602,794],[700,650,786],[820,676,782],[880,672,790]];
function cr(p0,p1,p2,p3,t){const t2=t*t,t3=t2*t;return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);}
function prof(y){let i=0;while(i<PROF.length-2&&y>PROF[i+1][0])i++;const a=PROF[Math.max(0,i-1)],b=PROF[i],c=PROF[i+1],d=PROF[Math.min(PROF.length-1,i+2)];const t=Math.min(1,Math.max(0,(y-b[0])/(c[0]-b[0])));return[cr(a[1],b[1],c[1],d[1],t)+OX,cr(a[2],b[2],c[2],d[2],t)+OX];}
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eOut=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,u)=>a+(b-a)*u;

const YD=285, THD=55*Math.PI/180;        // 다이얼 (높이, 단면 각도)
const CUFF=[40,128];                     // 위 접힌 밴드
function sleeveW(y){return clamp((y-110)/80)*clamp((820-y)/80);}
function ring(y,p){const yy=YD+(y-YD)*(1-.02*p*sleeveW(y));const[xb,xf]=prof(yy),s=1-.06*p*sleeveW(yy);const cx=(xb+xf)/2,rx=(xf-xb)/2*s;return{y:yy,cx,rx,ry:rx*.22};}
const pt=(r,th)=>[r.cx+r.rx*Math.cos(th),r.y+r.ry*Math.sin(th)];
const near=th=>Math.sin(th)>=0;
function line(pts,a,w,col=LIME){if(a<=0.003||pts.length<2)return;g.strokeStyle=`rgba(${col},${a})`;g.lineWidth=w;g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();}
// 감기는 선(와이어·패널 솔기): y0→y1 동안 각도가 k(rad/px)씩 증가, 보이는 면은 진하게
function helix(y0,y1,th0,k,p,vis,aNear,aFar,wNear,wFar,col=LIME){
  let segs=[],cur=[],pn=null;const n=70;
  for(let i=0;i<=n;i++){const y=lerp(y0,y1,i/n);if(!vis(y))continue;const th=th0+Math.abs(y-y0)*k,nr=near(th),q=pt(ring(y,p),th);
    if(pn!==null&&nr!==pn){segs.push([cur,pn]);cur=[cur[cur.length-1]];}pn=nr;cur.push(q);}
  segs.push([cur,pn]);segs.forEach(([s,nr])=>line(s,nr?aNear:aFar,nr?wNear:wFar,col));
}
const WIRES=[[YD,760,.0062],[YD,700,.0078],[YD,620,.0098]];  // 와이어는 다이얼 아래 사선 패널 안에서만
function wireAt(w,p,u){const[y0,y1,k]=w,y=lerp(y0,y1,u),th=THD+Math.abs(y-y0)*k;return[ring(y,p),th];}

// 발: 발목 중심 A를 축으로 회전 (+ = 발끝이 내려감)
const A=[730+OX,880];
const FOOT=[[790,866],[860,890],[930,915],[1010,946],[1032,962],[1012,978],[860,976],[700,972],[652,960],[646,925],[668,888]].map(([x,y])=>[x+OX,y]);
const TOE=[1030+OX,962], HEEL=[648+OX,958];
// 발걸이: 발목 앞에서 발바닥 아치 밑을 지나 발목 뒤로 (뒤꿈치는 트임)
const STIR=[[784,868],[812,900],[832,940],[842,972],[800,980],[748,972],[712,940],[690,905],[676,884]].map(([x,y])=>[x+OX,y]);
const rot=(q,ang)=>{const c=Math.cos(ang),s=Math.sin(ang),dx=q[0]-A[0],dy=q[1]-A[1];return[A[0]+dx*c-dy*s,A[1]+dx*s+dy*c];};

// 로고 (Z-zero 마크)
const LOGO=new Path2D('M0 0V158L41 116V43H128L0 172V250H170V83L126 127V207H42L170 70V0Z');
function logo(x,y,h,a){g.save();g.translate(x,y);g.scale(h/250,h/250);g.fillStyle=`rgba(${LIME},${a})`;g.fill(LOGO);g.restore();}

// 글자
const FK="'Wanted Sans'", FD="'Zero Display'";
function wrap(str,maxW){const out=[];let cur='';for(const w of str.split(' ')){const nx=cur?cur+' '+w:w;if(g.measureText(nx).width>maxW&&cur){out.push(cur);cur=w;}else cur=nx;}if(cur)out.push(cur);return out;}
function card(t,[t0,t1],num,title,sub){
  if(!TEXT)return;const a=eOut(seg(t,t0+.25,t0+.75))*(1-seg(t,t1-.35,t1-.05));if(a<=0)return;const dy=(1-eOut(seg(t,t0+.25,t0+.85)))*24;
  const x=860;g.save();g.globalAlpha=a;g.textBaseline='alphabetic';
  g.fillStyle=`rgb(${LIME})`;g.font=`600 60px ${FD}`;g.fillText(num,x,330+dy);
  g.fillStyle=`rgb(${WHITE})`;g.font=`700 54px ${FK}`;g.fillText(title,x,402+dy);
  g.fillStyle=`rgb(${GREY})`;g.font=`400 27px ${FK}`;wrap(sub,470).forEach((l,i)=>g.fillText(l,x,458+dy+i*40));
  g.restore();
}
function bigNum(t,from,to,ta,tb,showA,showB,label){
  if(!TEXT)return;const a=eOut(seg(t,showA,showA+.4))*(1-seg(t,showB-.35,showB-.05));if(a<=0)return;
  const v=Math.round(lerp(from,to,ease(seg(t,ta,tb))));const col=v>=60?ORANGE:LIME;
  g.save();g.globalAlpha=a;g.fillStyle=`rgb(${GREY})`;g.font=`500 24px ${FK}`;g.fillText(label,860,600);
  g.fillStyle=`rgb(${col})`;g.font=`600 150px ${FD}`;g.fillText(v+'%',852,735);g.restore();
}

function draw(t){
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);
  if(BG){g.fillStyle='#0b0c0a';g.fillRect(0,0,W,H);}
  // 진행값
  const scan=ease(seg(t,.2,1.6));
  const turn=ease(seg(t,10.3,10.9));
  const p=ease(seg(t,10.4,11.4));
  const dis=ease(seg(t,S.end[0],S.end[0]+1.1));
  const yTop=40,yBot=880;
  const yScan=yTop+(yBot-yTop+60)*scan, yDis=yBot-(yBot-yTop+60)*dis;
  const vis=y=>y<=yScan&&y<=yDis, fade=y=>clamp((yScan-y)/40)*clamp((yDis-y)/40);
  const camOn=seg(t,S.cam[0]+.2,S.cam[0]+.8)*(1-seg(t,S.cam[1]-.4,S.cam[1]));
  const footAng = camOn>0 ? (-.10+.32*Math.sin((t-S.cam[0])*2.6))*seg(t,S.cam[0]+.6,S.cam[0]+1.2) : 0;
  // 부하 값 (게이지)
  let load=38; load=lerp(38,64,ease(seg(t,3.8,6.6))); load=lerp(load,46,ease(seg(t,10.4,11.6))); load=lerp(load,38,seg(t,S.cam[0],S.cam[0]+2));
  const alertOn=t>=S.alert[0]&&t<10.4;
  const glow=1+.6*p*(1-seg(t,12,13.5));

  // 다리·발 실루엣
  if(FILL){
    const L=[],R=[];for(let y=yTop;y<=yBot;y+=6){const r=ring(y,p);L.push([r.cx-r.rx,r.y]);R.push([r.cx+r.rx,r.y]);}
    g.fillStyle=`rgba(26,28,25,${0.95*(1-dis)})`;g.beginPath();L.concat(R.reverse()).forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill();
    g.beginPath();FOOT.map(q=>rot(q,footAng)).forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill();
  }
  g.save();g.globalCompositeOperation=BG?'lighter':'source-over';g.shadowColor=`rgba(${LIME},.9)`;g.shadowBlur=10*glow;

  if(scan>0){
    // 근육 감지 파동 (sense 장면): 다이얼에서 위아래로 퍼지는 밝기
    const senseA=seg(t,3.4,3.9)*(1-seg(t,6.8,7.2));
    const wave=y=>{if(senseA<=0)return 0;let b=0;for(let k=0;k<3;k++){const R=((t-3.4)*360+k*220)%660;b+=Math.exp(-Math.pow((Math.abs(y-YD)-R)/34,2));}return b*senseA;};
    // 단면 링 (위 밴드는 촘촘하게)
    const ys=[];for(let y=CUFF[0];y<CUFF[1];y+=11)ys.push(y);for(let y=CUFF[1]+12;y<=860;y+=24)ys.push(y);
    ys.forEach(y0=>{if(!vis(y0))return;const r=ring(y0,p),f=fade(y0),w=sleeveW(y0);const wv=wave(y0);
      const a=(.30+.28*p*w+.55*wv)*f*glow;const N=[],F=[];for(let i=0;i<=40;i++){const th=Math.PI*i/40;N.push(pt(r,th));F.push(pt(r,Math.PI+th));}
      line(F,a*.28,1);line(N,Math.min(1,a),1.3+wv*1.2);});
    // 밴드 경계선
    [CUFF[0],CUFF[1]].forEach(y0=>{if(!vis(y0))return;const r=ring(y0,p),N=[],F=[];for(let i=0;i<=40;i++){const th=Math.PI*i/40;N.push(pt(r,th));F.push(pt(r,Math.PI+th));}line(F,.3*fade(y0),1.5);line(N,.85*fade(y0),2.2);});
    // 세로선
    for(let k=0;k<16;k++){const th=k/16*Math.PI*2,a0=near(th)?.2:.06,pts=[];for(let y0=yTop;y0<=Math.min(860,yScan,yDis);y0+=8)pts.push(pt(ring(y0,p),th));line(pts,a0*glow,1);}
    // 사선 패널 솔기 2줄 (다이얼 위·아래로 지나감)
    helix(YD-150,640,THD-.55,.0085,p,vis,.75,.22,2.2,1.2,WHITE);
    helix(YD+40,860,THD-.35,.0085,p,vis,.75,.22,2.2,1.2,WHITE);
    // 와이어
    const wA=.55+.4*p;WIRES.forEach(w=>{const[y0,y1,k]=w;helix(y0,y1,THD,k,p,vis,wA*glow,.2,2.3,1.2);});
    // 조일 때 빛이 다이얼 쪽으로 흐름
    if(p>0&&p<1)WIRES.forEach((w,wi)=>{for(let j=0;j<3;j++){const u=1-((p*1.6+j*.33+wi*.11)%1);const[r,th]=wireAt(w,p,u);if(!near(th)||!vis(r.y))continue;const[x,y]=pt(r,th);g.fillStyle=`rgba(${LIME},${.95*Math.sin(p*Math.PI)})`;g.beginPath();g.arc(x,y,4.5,0,7);g.fill();}});
    // 발걸이 + 발 윤곽
    const footA=seg(yScan,860,940)*(1-dis);
    line(STIR.map(q=>rot(q,footAng)),.8*footA,2.2,LIME);
    line(FOOT.concat([FOOT[0]]).map(q=>rot(q,footAng)),(.22+.35*camOn)*footA,1.4,WHITE);
    // 스캔 라인
    if(scan<1){const r=ring(Math.min(yScan,860),p);g.shadowBlur=24;line([[r.cx-r.rx-50,Math.min(yScan,940)],[r.cx+r.rx+50,Math.min(yScan,940)]],.9,2);g.shadowBlur=10;}
  }

  // 카메라 모듈 (다이얼 아래) + 시야 + 발 포인트
  const dr=ring(YD,p);let[dx,dy]=pt(dr,THD);
  if(alertOn)dx+=3*Math.sin(t*2*Math.PI*22);
  const cam=[dx+4,dy+78], cf=fade(YD+78);
  if(cf>0){
    if(camOn>0){
      const toe=rot(TOE,footAng),heel=rot(HEEL,footAng);
      const wipe=eOut(seg(t,S.cam[0]+.2,S.cam[0]+.9));
      const c1=[lerp(cam[0],toe[0]+30,wipe),lerp(cam[1],toe[1]+20,wipe)],c2=[lerp(cam[0],heel[0]-30,wipe),lerp(cam[1],heel[1]+20,wipe)];
      g.shadowBlur=0;g.fillStyle=`rgba(${LIME},${.07*camOn})`;g.beginPath();g.moveTo(cam[0],cam[1]);g.lineTo(c1[0],c1[1]);g.lineTo(c2[0],c2[1]);g.closePath();g.fill();
      g.shadowBlur=8;line([c1,cam,c2],.45*camOn,1.2);
      // 발끝·발목·뒤꿈치
      const pa=camOn*seg(t,S.cam[0]+.8,S.cam[0]+1.3);
      if(pa>0){line([toe,A,heel],.7*pa,1.6,WHITE);
        // 발목 각도 호: 정강이 축(위쪽)과 발 방향 사이
        const shin=Math.atan2(-1,-.06),foot=Math.atan2(toe[1]-A[1],toe[0]-A[0]);
        g.strokeStyle=`rgba(${LIME},${.9*pa})`;g.lineWidth=2.5;g.beginPath();g.arc(A[0],A[1],58,shin,foot);g.stroke();
        [toe,A,heel].forEach(q=>{g.fillStyle=`rgba(${LIME},${pa})`;g.beginPath();g.arc(q[0],q[1],8,0,7);g.fill();g.strokeStyle=`rgba(${LIME},${.35*pa})`;g.lineWidth=2;g.beginPath();g.arc(q[0],q[1],16+4*Math.sin(t*6),0,7);g.stroke();});
        if(TEXT){const deg=Math.round((foot-shin)*180/Math.PI);g.shadowBlur=0;g.fillStyle=`rgba(${WHITE},${pa})`;g.font=`600 46px ${FD}`;const mid=(shin+foot)/2;g.fillText(deg+'°',A[0]+Math.cos(mid)*92-18,A[1]+Math.sin(mid)*92+14);}
      }
    }
    g.shadowBlur=6+10*camOn;g.fillStyle=`rgba(13,14,15,${cf})`;g.strokeStyle=`rgba(${LIME},${(.5+.5*camOn)*cf})`;g.lineWidth=2;
    g.beginPath();g.roundRect(cam[0]-16,cam[1]-11,32,22,6);g.fill();g.stroke();
    g.fillStyle=`rgba(${LIME},${(.5+.5*camOn)*cf})`;g.beginPath();g.arc(cam[0],cam[1],5,0,7);g.fill();
    line([[dx,dy+44],[cam[0],cam[1]-11]],.5*cf,1.5);
  }
  g.restore();

  // 다이얼
  const f=fade(YD);
  if(f>0){
    const R=44;g.save();g.translate(dx,dy);
    // 부하 게이지 (sense~tight 장면)
    const gA=seg(t,3.5,4)*(1-seg(t,S.cam[0],S.cam[0]+.6))*f;
    if(gA>0){const col=load>=60?ORANGE:LIME;g.strokeStyle=`rgba(${WHITE},${.12*gA})`;g.lineWidth=6;g.beginPath();g.arc(0,0,R+16,0,7);g.stroke();
      g.shadowColor=`rgba(${col},1)`;g.shadowBlur=14;g.strokeStyle=`rgba(${col},${gA})`;g.beginPath();g.arc(0,0,R+16,-Math.PI/2,-Math.PI/2+load/100*Math.PI*2);g.stroke();g.shadowBlur=0;}
    // 경고: 주황 진동 링
    if(alertOn){const k=(t-S.alert[0])*1.6%1;g.strokeStyle=`rgba(${ORANGE},${(1-k)*.9})`;g.lineWidth=3;g.shadowColor=`rgba(${ORANGE},1)`;g.shadowBlur=20;g.beginPath();g.arc(0,0,R+24+k*70,0,7);g.stroke();g.shadowBlur=0;}
    // 조임 완료: 라임 링
    const fl=seg(t,11.3,12);if(fl>0&&fl<1){g.strokeStyle=`rgba(${LIME},${1-fl})`;g.lineWidth=3;g.shadowColor=`rgba(${LIME},1)`;g.shadowBlur=24;g.beginPath();g.arc(0,0,R+24+110*ease(fl),0,7);g.stroke();g.shadowBlur=0;}
    g.fillStyle=`rgba(13,14,15,${.96*f})`;g.beginPath();g.arc(0,0,R,0,7);g.fill();
    g.strokeStyle=`rgba(${alertOn?ORANGE:LIME},${.9*f})`;g.lineWidth=2;g.beginPath();g.arc(0,0,R,0,7);g.stroke();
    g.rotate(turn*Math.PI);
    for(let i=0;i<24;i++){const a=i/24*Math.PI*2;g.strokeStyle=`rgba(${WHITE},${.35*f})`;g.lineWidth=1.5;g.beginPath();g.moveTo(Math.cos(a)*(R-9),Math.sin(a)*(R-9));g.lineTo(Math.cos(a)*(R-3),Math.sin(a)*(R-3));g.stroke();}
    g.shadowColor=`rgba(${LIME},1)`;g.shadowBlur=12;g.strokeStyle=`rgba(${alertOn?ORANGE:LIME},${f})`;g.lineWidth=4;g.beginPath();g.moveTo(0,-R+12);g.lineTo(0,-R+28);g.stroke();
    // ½바퀴 화살표
    const ar=seg(t,10.1,10.3)*(1-seg(t,11.2,11.5));
    g.restore();
    if(ar>0){g.save();g.translate(dx,dy);g.strokeStyle=`rgba(${WHITE},${.85*ar})`;g.lineWidth=3;g.beginPath();const a0=-Math.PI/2,a1=a0+Math.PI*Math.max(.05,turn);g.arc(0,0,R+40,a0,a1);g.stroke();
      const ex=Math.cos(a1)*(R+40),ey=Math.sin(a1)*(R+40);g.translate(ex,ey);g.rotate(a1+Math.PI/2);g.fillStyle=`rgba(${WHITE},${.85*ar})`;g.beginPath();g.moveTo(0,-9);g.lineTo(12,0);g.lineTo(0,9);g.closePath();g.fill();g.restore();}
  }

  // 글자
  card(t,S.scan,'Z-ZERO','스마트 카프 슬리브','종아리 부하를 미리 읽고, 쥐가 오기 전에 조여 주는 슬리브');
  card(t,S.sense,'01','근육 부하 감지','다이얼 뒷면의 압력 센서(FMG)가 근육이 지쳐 단단해지는 힘을 읽어요');
  bigNum(t,38,64,3.8,6.6,3.9,7.2,'종아리 부하');
  card(t,S.alert,'02','쥐 오기 전 알림','부하가 경고 기준을 넘으면 다이얼이 진동해요');
  bigNum(t,64,64,0,1,7.4,9.6,'종아리 부하');
  card(t,S.tight,'03','½바퀴로 조이기','다이얼을 돌리면 사선 패널 속 와이어가 종아리를 감아 조여요');
  bigNum(t,64,46,10.4,11.6,9.8,14.2,'종아리 부하');
  card(t,S.cam,'04','발 움직임 분석','다이얼 아래 카메라가 발끝·발목·뒤꿈치 각도를 기록해요');
  // 모서리 로고
  const cornerA=seg(t,1,1.6)*(1-seg(t,S.end[0],S.end[0]+.5));if(cornerA>0&&TEXT)logo(1340,46,44,.9*cornerA);
  // 엔딩
  const la=eOut(seg(t,S.end[0]+.9,S.end[0]+1.6));
  if(la>0){logo(W/2-60,330,240,la);if(TEXT){g.globalAlpha=la;g.textAlign='center';g.fillStyle=`rgb(${WHITE})`;g.font=`600 96px ${FD}`;g.fillText('Z-ZERO',W/2,690);

}
